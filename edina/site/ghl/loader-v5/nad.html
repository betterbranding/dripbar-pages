<script>
/* The DRIPBaR Edina loader v5 (body element) | nad */
(function () {
  var GH = 'https://betterbranding.github.io/dripbar-pages';
  try {
    var st = document.createElement('style');
    st.id = 'fastSplash';
    st.textContent = 'html{background:#044E63!important}body>*{visibility:hidden!important}' +
      'html::before{content:"";position:fixed;inset:0;z-index:2147483646;background-color:#044E63;' +
      'background-image:url(' + GH + '/assets/email/logo-white-green.png);background-repeat:no-repeat;' +
      'background-position:center calc(50% - 26px);background-size:min(200px,52vw) auto}' +
      'html::after{content:"";position:fixed;top:calc(50% + 34px);left:50%;width:26px;height:26px;margin-left:-13px;' +
      'border-radius:50%;border:2px solid rgba(255,255,255,.18);border-top-color:#AFB216;' +
      'animation:fastspin .8s linear infinite;z-index:2147483647}' +
      '@keyframes fastspin{to{transform:rotate(360deg)}}' +
      '@media (prefers-reduced-motion:reduce){html::after{animation:none}}';
    (document.head || document.documentElement).appendChild(st);
  } catch (e) {}
  fetch(GH + '/edina/site/nad/index.html?v=1').then(function (r) {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.text();
  }).then(function (html) {
    document.open();
    document.write(html);
    document.close();
  }).catch(function (e) {
    var s = document.getElementById('fastSplash');
    if (s && s.parentNode) s.parentNode.removeChild(s);
  });
})();
</script>
