<!--
  DRIP Direct Hawaii - GHL Tracking Code
  Page: Product details
  Individual product detail page (reads ?p=slug from URL)

  INSTRUCTIONS:
  1. In GHL, go to Sites > Funnels/Websites
  2. Open the "Product details" page editor
  3. Settings (gear icon) > Custom Code > Header Code
  4. Paste this entire snippet
  5. Update PAGE_URLS below with your actual GHL page paths
  6. Save & publish
-->

<script>
// ============================================================
//  CONFIGURE YOUR GHL PAGE URLs HERE
//  Replace these with your actual GHL funnel/website page paths
// ============================================================
var PAGE_URLS = {
  home:           '/home',
  products:       '/products-list',
  productDetails: '/product-details',
  cart:           '/cart',
  checkout:       '/checkout',
  thankyou:       '/thank-you',
  contact:        '/contact-us'
};
</script>

<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- Store CSS -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/betterbranding/dripbar-pages@main/hawaii/css/styles.css">

<style>
  .hl_page-preview--content,
  #preview-container,
  .hl-page-builder,
  body { background: #0a0a0f !important; }
  .hl_page-preview--content > div:not(#dd-store-root),
  #sections_list,
  #preview-container > div:not(#dd-store-root) { display: none !important; }
  #dd-store-root { min-height: 100vh; }
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
  var root = document.createElement('div');
  root.id = 'dd-store-root';
  document.body.appendChild(root);

  var CDN_BASE = 'https://cdn.jsdelivr.net/gh/betterbranding/dripbar-pages@main/hawaii';
  var PAGE_HTML = CDN_BASE + '/pages/product.html';
  var SHARED_JS = CDN_BASE + '/js/shared.js';

  var sharedScript = document.createElement('script');
  sharedScript.src = SHARED_JS;
  sharedScript.onload = function() {
    DD.pageUrls = PAGE_URLS;
    DD.cartPageUrl = PAGE_URLS.cart;

    fetch(PAGE_HTML)
      .then(function(r) { return r.text(); })
      .then(function(html) {
        var parser = new DOMParser();
        var doc = parser.parseFromString(html, 'text/html');
        var content = doc.body.innerHTML;

        // Replace placeholder URLs
        content = content.replace(/PAGE_URL_HOME/g, PAGE_URLS.home);
        content = content.replace(/PAGE_URL_PRODUCTS/g, PAGE_URLS.products);
        content = content.replace(/PAGE_URL_PRODUCT_DETAILS/g, PAGE_URLS.productDetails);
        content = content.replace(/PAGE_URL_CART/g, PAGE_URLS.cart);
        content = content.replace(/PAGE_URL_CHECKOUT/g, PAGE_URLS.checkout);
        content = content.replace(/PAGE_URL_THANKYOU/g, PAGE_URLS.thankyou);
        content = content.replace(/PAGE_URL_CONTACT/g, PAGE_URLS.contact);
        content = content.replace(/IMG_BASE/g, CDN_BASE);

        root.innerHTML = content;

        // Execute inline scripts
        var scripts = root.querySelectorAll('script');
        scripts.forEach(function(oldScript) {
          var newScript = document.createElement('script');
          if (oldScript.src) {
            newScript.src = oldScript.src;
          } else {
            newScript.textContent = oldScript.textContent;
          }
          oldScript.parentNode.replaceChild(newScript, oldScript);
        });

        // Apply inline styles from page
        var styles = doc.head.querySelectorAll('style');
        styles.forEach(function(s) {
          var ns = document.createElement('style');
          ns.textContent = s.textContent;
          document.head.appendChild(ns);
        });

        DD.initShared();
      })
      .catch(function(err) {
        console.error('[DripDirect Hawaii] Failed to load store:', err);
        root.innerHTML = '<div style="color:white;text-align:center;padding:100px 20px;">' +
          '<h2>Store loading...</h2><p>Please refresh the page.</p></div>';
      });
  };
  document.head.appendChild(sharedScript);
});
</script>
